name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - name: Shim webkit2gtk-4.0 pkg-config
        run: |
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          cat > "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: compat shim for webkit2gtk-4.1
          Version: 2.44.0
          Requires: webkit2gtk-4.1
          PC
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/greetdeez/package-lock.json

      - name: Build UI
        run: make ui

      - name: Build binary
        run: make build

      - name: Run tests
        run: go test ./...
