name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.25
      env:
        CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        run: cd ui/greetdeez && npm ci && npm run build

      - name: Install cross-compile deps
        run: |
          dpkg --add-architecture arm64 && apt-get update -qq
          apt-get install -yqq libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0:arm64
          mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/*.pc; do
            sed 's|x86_64-linux-gnu|aarch64-linux-gnu|g' "$pc" \
              > "/usr/lib/aarch64-linux-gnu/pkgconfig/$(basename "$pc")"
          done
          for dir in /usr/lib/x86_64-linux-gnu/*/include; do
            [ -d "$dir" ] || continue
            target=$(echo "$dir" | sed 's/x86_64-linux-gnu/aarch64-linux-gnu/')
            mkdir -p "$target" && cp -a "$dir"/* "$target"/
          done
          cd /usr/lib/aarch64-linux-gnu && for f in *.so.[0-9]*; do
            base="${f%.so.*}.so"; [ ! -e "$base" ] && ln -sf "$f" "$base"
          done
          mkdir -p /tmp/pkgconfig
          printf 'Name: webkit2gtk-4.0\nDescription: compat\nVersion: 2.44.0\nRequires: webkit2gtk-4.1\n' > /tmp/pkgconfig/webkit2gtk-4.0.pc

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          PKG_CONFIG_PATH: /tmp/pkgconfig
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/.ssh && ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          goreleaser release --clean

      - name: Publish to Cloudsmith
        if: "!contains(github.ref, '-')"
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          [ -z "$CLOUDSMITH_API_KEY" ] && exit 0
          pip3 install -q --break-system-packages cloudsmith-cli
          for ext in deb rpm; do
            for f in dist/*.$ext; do [ -f "$f" ] && cloudsmith push $ext nickheyer/greetdeez/any-distro/any-version "$f" --republish; done
          done
          for f in dist/*.apk; do [ -f "$f" ] && cloudsmith push alpine nickheyer/greetdeez/alpine/any-version "$f" --republish; done
