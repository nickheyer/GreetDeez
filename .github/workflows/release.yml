name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - name: Shim webkit2gtk-4.0 pkg-config
        run: |
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          cat > "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: compat shim for webkit2gtk-4.1
          Version: 2.44.0
          Requires: webkit2gtk-4.1
          PC
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/greetdeez/package-lock.json

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build UI
        run: cd ui/greetdeez && npm ci && npm run build

      - name: Build and package
        run: goreleaser release --split --skip=publish --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-parts/

      - name: Merge artifacts
        run: |
          mkdir -p dist
          cp -r dist-parts/dist-amd64/* dist/ || true
          cp -r dist-parts/dist-arm64/* dist/ || true
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.apk
            dist/*.tar.gz
            dist/checksums.txt

  publish-cloudsmith:
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - name: Check for Cloudsmith key
        id: cs-check
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.cs-check.outputs.has_key == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist-parts/

      - name: Merge artifacts
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          mkdir -p dist
          cp -r dist-parts/dist-amd64/* dist/ || true
          cp -r dist-parts/dist-arm64/* dist/ || true

      - name: Setup Cloudsmith CLI
        if: steps.cs-check.outputs.has_key == 'true'
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish deb packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.deb; do
            [ -f "$f" ] || continue
            cloudsmith push deb nickheyer/greetdeez/any-distro/any-version "$f" --republish
          done

      - name: Publish rpm packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.rpm; do
            [ -f "$f" ] || continue
            cloudsmith push rpm nickheyer/greetdeez/any-distro/any-version "$f" --republish
          done

      - name: Publish apk packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.apk; do
            [ -f "$f" ] || continue
            cloudsmith push alpine nickheyer/greetdeez/alpine/any-version "$f" --republish
          done

  publish-aur:
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AUR key
        id: aur-check
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        if: steps.aur-check.outputs.has_key == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist-parts/

      - name: Merge artifacts
        if: steps.aur-check.outputs.has_key == 'true'
        run: |
          mkdir -p dist
          cp -r dist-parts/dist-amd64/* dist/ || true
          # Merge artifacts.json from both arches before copying arm64 files
          if [ -f dist/artifacts.json ] && [ -f dist-parts/dist-arm64/artifacts.json ]; then
            jq -s 'add | unique_by(.name)' \
              dist/artifacts.json \
              dist-parts/dist-arm64/artifacts.json \
              > dist/artifacts.merged.json
            mv dist/artifacts.merged.json dist/artifacts.json
          fi
          cp -rn dist-parts/dist-arm64/* dist/ || true

      - uses: actions/setup-go@v5
        if: steps.aur-check.outputs.has_key == 'true'
        with:
          go-version: "1.25"

      - name: Install GoReleaser
        if: steps.aur-check.outputs.has_key == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Setup SSH for AUR
        if: steps.aur-check.outputs.has_key == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Publish to AUR
        if: steps.aur-check.outputs.has_key == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: goreleaser release --skip=build,validate,publish
