name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - name: Shim webkit2gtk-4.0 pkg-config
        run: |
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          cat > "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: compat shim for webkit2gtk-4.1
          Version: 2.44.0
          Requires: webkit2gtk-4.1
          PC
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/greetdeez/package-lock.json

      - name: Build UI
        run: cd ui/greetdeez && npm ci && npm run build

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=$VERSION" -o greetdeez ./cmd/greetdeez

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goarch }}
          path: greetdeez

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage prebuilt binaries
        run: |
          mkdir -p prebuilt/greetdeez_linux_amd64 prebuilt/greetdeez_linux_arm64
          cp artifacts/binary-amd64/greetdeez prebuilt/greetdeez_linux_amd64/greetdeez
          cp artifacts/binary-arm64/greetdeez prebuilt/greetdeez_linux_arm64/greetdeez
          chmod +x prebuilt/greetdeez_linux_*/greetdeez

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-cloudsmith:
    needs: release
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - name: Check for Cloudsmith key
        id: cs-check
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download dist
        if: steps.cs-check.outputs.has_key == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup Cloudsmith CLI
        if: steps.cs-check.outputs.has_key == 'true'
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Publish deb packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.deb; do
            [ -f "$f" ] || continue
            cloudsmith push deb nickheyer/greetdeez/any-distro/any-version "$f" --republish
          done

      - name: Publish rpm packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.rpm; do
            [ -f "$f" ] || continue
            cloudsmith push rpm nickheyer/greetdeez/any-distro/any-version "$f" --republish
          done

      - name: Publish apk packages
        if: steps.cs-check.outputs.has_key == 'true'
        run: |
          for f in dist/*.apk; do
            [ -f "$f" ] || continue
            cloudsmith push alpine nickheyer/greetdeez/alpine/any-version "$f" --republish
          done
