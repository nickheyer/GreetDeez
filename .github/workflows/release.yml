name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/greetdeez/package-lock.json

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Build UI
        run: cd ui/greetdeez && npm ci && npm run build

      - name: Set CGO flags for webkit2gtk-4.1
        run: |
          echo "CGO_CFLAGS=$(pkg-config --cflags webkit2gtk-4.1 gtk+-3.0)" >> "$GITHUB_ENV"
          echo "CGO_CXXFLAGS=$(pkg-config --cflags webkit2gtk-4.1 gtk+-3.0)" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=$(pkg-config --libs webkit2gtk-4.1 gtk+-3.0)" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"

      - name: Build and package
        run: goreleaser release --single-target --skip=publish --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-parts/

      - name: Merge artifacts
        run: |
          mkdir -p dist
          cp -r dist-parts/dist-amd64/* dist/ || true
          cp -r dist-parts/dist-arm64/* dist/ || true
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.apk
            dist/*.tar.gz
            dist/checksums.txt
