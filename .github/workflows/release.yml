name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/goreleaser/goreleaser-cross:v1.26
      env:
        CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install buf and protoc-gen-es
        run: npm install -g @bufbuild/buf @bufbuild/protoc-gen-es

      - name: Generate code
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install -buildvcs=false google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install -buildvcs=false ./cmd/protoc-gen-greetdeez-go
          go install -buildvcs=false ./cmd/protoc-gen-greetdeez-es
          buf generate

      - name: Build proto package
        run: cd npm/proto && npm ci && npm run build

      - name: Build UI
        run: cd ui/default && npm ci && npm run build

      - name: Install cross-compile deps
        run: |
          dpkg --add-architecture arm64 && apt-get update -qq
          apt-get install -yqq libwebkit2gtk-4.1-dev libwebkit2gtk-4.1-0:arm64 python3-pip
          mkdir -p /usr/lib/aarch64-linux-gnu/pkgconfig
          for pc in /usr/lib/x86_64-linux-gnu/pkgconfig/*.pc; do
            sed 's|x86_64-linux-gnu|aarch64-linux-gnu|g' "$pc" \
              > "/usr/lib/aarch64-linux-gnu/pkgconfig/$(basename "$pc")"
          done
          for dir in /usr/lib/x86_64-linux-gnu/*/include; do
            [ -d "$dir" ] || continue
            target=$(echo "$dir" | sed 's/x86_64-linux-gnu/aarch64-linux-gnu/')
            mkdir -p "$target" && cp -a "$dir"/* "$target"/
          done
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          LIBS=$(pkg-config --libs-only-l webkit2gtk-4.1 gtk+-3.0 | tr ' ' '\n' | sed 's/^-l//' | sort -u)
          cd /usr/lib/aarch64-linux-gnu
          for lib in $LIBS; do
            target="lib${lib}.so"
            [ -e "$target" ] && continue
            src=$(ls "lib${lib}".so.[0-9]* 2>/dev/null | head -1)
            [ -n "$src" ] && ln -sf "$src" "$target"
          done

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p ~/.ssh && ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          goreleaser release --clean

      - name: Publish to Cloudsmith
        if: "!contains(github.ref, '-')"
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          [ -z "$CLOUDSMITH_API_KEY" ] && exit 0
          pip3 install -q --break-system-packages cloudsmith-cli
          for ext in deb rpm; do
            for f in dist/*.$ext; do [ -f "$f" ] && cloudsmith push $ext nickheyer/greetdeez/any-distro/any-version "$f" --republish; done
          done
          for f in dist/*.apk; do [ -f "$f" ] && cloudsmith push alpine nickheyer/greetdeez/alpine/any-version "$f" --republish; done
