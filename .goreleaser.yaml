version: 2

project_name: greetdeez

builds:
  - main: ./cmd/greetdeez
    binary: greetdeez
    env: [CGO_ENABLED=1]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    overrides:
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
          - PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig:/tmp/pkgconfig

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - config/greetd.toml
      - config/greetdeez.conf
      - packaging/sysusers.d/greetdeez.conf
      - packaging/tmpfiles.d/greetdeez.conf
      - packaging/scripts/post-install.sh
      - LICENSE
      - README.md

nfpms:
  - package_name: greetdeez
    vendor: nickheyer
    homepage: https://github.com/nickheyer/greetdeez
    maintainer: Nick Heyer <nick@heyer.app>
    description: Minimal, hackable display manager greeter for greetd
    license: MIT
    formats: [deb, rpm, archlinux, apk]
    bindir: /usr/bin
    contents:
      - src: config/greetd.toml
        dst: /etc/greetd/greetd.toml
        type: config
      - src: config/greetdeez.conf
        dst: /etc/greetd/greetdeez.conf
        type: config
      - src: packaging/sysusers.d/greetdeez.conf
        dst: /usr/lib/sysusers.d/greetdeez.conf
      - src: packaging/tmpfiles.d/greetdeez.conf
        dst: /usr/lib/tmpfiles.d/greetdeez.conf
    scripts:
      postinstall: packaging/scripts/post-install.sh
    overrides:
      deb:
        dependencies: [greetd, libwebkit2gtk-4.1-0, cage]
      rpm:
        dependencies: [greetd, webkit2gtk4.1, cage]
      archlinux:
        dependencies: [greetd, webkit2gtk, cage]
      apk:
        dependencies: [greetd, webkit2gtk-4.1, cage]

aurs:
  - name: greetdeez-bin
    ids: [tarball]
    homepage: https://github.com/nickheyer/greetdeez
    description: "Minimal, hackable display manager greeter for greetd — Go + Svelte 5 + webkit2gtk"
    maintainers: ["Nick Heyer <nick@heyer.app>"]
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/greetdeez-bin.git"
    skip_upload: '{{ if .Env.AUR_KEY }}auto{{ else }}true{{ end }}'
    depends: [greetd, webkit2gtk, cage]
    provides: [greetdeez]
    conflicts: [greetdeez]
    backup:
      - etc/greetd/greetd.toml
      - etc/greetd/greetdeez.conf
    install: |-
      post_install() {
          # sysusers.d/tmpfiles.d handle user + directory creation automatically.

          if [ ! -f /etc/greetd/config.toml ]; then
              cp /etc/greetd/greetd.toml /etc/greetd/config.toml
              echo "==> Installed greetd config: /etc/greetd/config.toml"
          elif ! grep -q greetdeez /etc/greetd/config.toml; then
              echo ""
              echo "==> greetd config exists but does not use greetdeez."
              echo "    To activate greetdeez, update [default_session] in /etc/greetd/config.toml:"
              echo ""
              echo "      [default_session]"
              echo "      command = \"cage -s -- /usr/bin/greetdeez\""
              echo "      user = \"greetdeez\""
              echo ""
          fi

          echo ""
          echo "==> To switch to greetdeez from your current display manager:"
          echo "    1. sudo systemctl disable --now <current-dm>   (e.g. sddm, gdm, lightdm)"
          echo "    2. sudo systemctl enable greetd"
          echo "    3. reboot"
          echo ""
      }

      post_upgrade() {
          post_install
      }
    package: |-
      install -Dm755 greetdeez "${pkgdir}/usr/bin/greetdeez"
      install -Dm644 config/greetd.toml "${pkgdir}/etc/greetd/greetd.toml"
      install -Dm644 config/greetdeez.conf "${pkgdir}/etc/greetd/greetdeez.conf"
      install -Dm644 packaging/sysusers.d/greetdeez.conf "${pkgdir}/usr/lib/sysusers.d/greetdeez.conf"
      install -Dm644 packaging/tmpfiles.d/greetdeez.conf "${pkgdir}/usr/lib/tmpfiles.d/greetdeez.conf"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/greetdeez-bin/LICENSE"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: nickheyer
    name: GreetDeez
