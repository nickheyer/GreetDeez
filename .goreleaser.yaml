version: 2

builds:
  - id: greetdeez
    main: ./cmd/greetdeez
    binary: greetdeez
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: tarball
    format: tar.gz
    name_template: "greetdeez_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - greetd.toml
      - greetdeez.conf
      - packaging/scripts/post-install.sh
      - LICENSE
      - README.md

nfpms:
  - id: greetdeez
    package_name: greetdeez
    vendor: nickheyer
    homepage: https://github.com/nickheyer/greetdeez
    maintainer: Nick Heyer <nick@heyer.app>
    description: Minimal, hackable display manager greeter for greetd
    license: MIT
    formats:
      - deb
      - rpm
      - archlinux
      - apk
    bindir: /usr/bin
    contents:
      - src: greetd.toml
        dst: /etc/greetd/greetd.toml
        type: config
      - src: greetdeez.conf
        dst: /etc/greetd/greetdeez.conf
        type: config
    scripts:
      postinstall: packaging/scripts/post-install.sh
    overrides:
      deb:
        dependencies:
          - greetd
          - libwebkit2gtk-4.1-0
          - cage
      rpm:
        dependencies:
          - greetd
          - webkit2gtk4.1
          - cage
      archlinux:
        dependencies:
          - greetd
          - webkit2gtk
          - cage
      apk:
        dependencies:
          - greetd
          - webkit2gtk-4.1
          - cage

checksum:
  name_template: checksums.txt

release:
  github:
    owner: nickheyer
    name: greetdeez
