syntax = "proto3";
package greetdeez.v1;

option go_package = "github.com/nickheyer/greetdeez/gen/go/greetdeez/v1;greetdeezv1";

// ── Sessions ────────────────────────────────────────────────────

enum SessionType {
  SESSION_TYPE_UNSPECIFIED = 0;
  SESSION_TYPE_WAYLAND     = 1;
  SESSION_TYPE_X11         = 2;
}

message Session {
  string          name    = 1;
  repeated string cmd     = 2;
  SessionType     type    = 3;
  string          desktop = 4;
}

// ── Power ───────────────────────────────────────────────────────

enum PowerAction {
  POWER_ACTION_UNSPECIFIED = 0;
  POWER_ACTION_POWEROFF    = 1;
  POWER_ACTION_REBOOT      = 2;
  POWER_ACTION_SUSPEND     = 3;
}

message PowerCapabilities {
  bool can_poweroff = 1;
  bool can_reboot   = 2;
  bool can_suspend  = 3;
}

// ── System ──────────────────────────────────────────────────────

message SystemInfo {
  string hostname = 1;
}

// ── State ───────────────────────────────────────────────────────

message GreeterState {
  string last_user    = 1;
  string last_session = 2;
}

// ── RPC messages ────────────────────────────────────────────────

// One-shot: authenticate + start session
message LoginRequest {
  string  username = 1;
  string  password = 2;
  Session session  = 3;
}
message LoginResponse {
  bool   success = 1;
  string error   = 2;
}

// Staged step 1: authenticate only
message AuthenticateRequest {
  string username = 1;
  string password = 2;
}
message AuthenticateResponse {
  bool   success = 1;
  string error   = 2;
}

// Staged step 2: start session (after successful Authenticate)
message StartSessionRequest {
  Session session = 1;
}
message StartSessionResponse {
  bool   success = 1;
  string error   = 2;
}

message ListSessionsRequest  {}
message ListSessionsResponse { repeated Session sessions = 1; }

message GetSystemInfoRequest  {}
message GetSystemInfoResponse { SystemInfo info = 1; }

message GetPowerCapabilitiesRequest  {}
message GetPowerCapabilitiesResponse { PowerCapabilities capabilities = 1; }

message ExecutePowerActionRequest  { PowerAction action = 1; }
message ExecutePowerActionResponse { bool ok = 1; string error = 2; }

message GetStateRequest  {}
message GetStateResponse { GreeterState state = 1; }

message SaveStateRequest  { GreeterState state = 1; }
message SaveStateResponse { bool ok = 1; string error = 2; }

// ── Service ─────────────────────────────────────────────────────

service GreeterService {
  rpc Login(LoginRequest)                 returns (LoginResponse);
  rpc Authenticate(AuthenticateRequest)   returns (AuthenticateResponse);
  rpc StartSession(StartSessionRequest)   returns (StartSessionResponse);

  rpc ListSessions(ListSessionsRequest)   returns (ListSessionsResponse);

  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  rpc GetPowerCapabilities(GetPowerCapabilitiesRequest) returns (GetPowerCapabilitiesResponse);
  rpc ExecutePowerAction(ExecutePowerActionRequest)     returns (ExecutePowerActionResponse);

  rpc GetState(GetStateRequest)           returns (GetStateResponse);
  rpc SaveState(SaveStateRequest)         returns (SaveStateResponse);
}
