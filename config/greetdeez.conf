# GreetDeez configuration
# Default location: /etc/greetd/greetdeez.conf
#
# All values below show the built-in defaults. Most are auto-detected
# from the host at startup — you only need this file to override them.
# Environment variables (GREETDEEZ_WINDOW_TITLE, etc.) override file values.

[window]
# title = "GreetDeez"
# width and height are auto-detected from DRM (/sys/class/drm/card*-*/modes).
# Under cage these are irrelevant since cage forces fullscreen.
# width  = 1920
# height = 1080
# Wayland output scale applied via wlr-output-management before the UI starts.
# scale = 1.5

[auth]
# timeout_seconds = 30

[power]
# enabled = true
# poweroff and reboot use POSIX shutdown(8). Only suspend is auto-detected.
# poweroff_cmd = ["shutdown", "-h", "now"]
# reboot_cmd   = ["shutdown", "-r", "now"]
# suspend_cmd  = ["systemctl", "suspend"]

[sessions]
# dirs = [
#     { path = "/usr/share/wayland-sessions", type = "wayland" },
#     { path = "/usr/share/xsessions", type = "x11" },
# ]
# X11 sessions are wrapped with this command prefix (prepended to the Exec= value).
# Set to [] to disable wrapping.
# x11_wrapper = ["startx", "/usr/bin/env"]

[ui]
# Built-in themes: "minimal" (default) and "cyber" — rendered in a webview
# under cage — and "metal", which skips the webview (and cage) entirely and
# renders straight to the framebuffer via DRM/KMS. For "metal", change the
# greetd command to run greetdeez WITHOUT cage (see /etc/greetd/config.toml)
# and make sure the greetdeez user is in the video and input groups.
# theme = "minimal"

# Set path to serve a custom UI instead of the embedded default.
# The directory should contain the built output of any @nickheyer/greetdeez client.
# path = "/usr/share/greetdeez-themes/my-theme/dist"