# GreetDeez configuration
# Default location: /etc/greetd/greetdeez.conf
#
# All values below show the built-in defaults. Most are auto-detected
# from the host at startup — you only need this file to override them.
# Environment variables (GREETDEEZ_WINDOW_TITLE, etc.) override file values.

[window]
# title = "GreetDeez"
# width and height are auto-detected from DRM (/sys/class/drm/card*-*/modes).
# Under cage these are irrelevant since cage forces fullscreen.
# width  = 1920
# height = 1080

[auth]
# timeout_seconds = 30

[power]
# enabled = true
# Commands are auto-detected: loginctl > systemctl > raw POSIX.
# poweroff_cmd = ["loginctl", "poweroff"]
# reboot_cmd   = ["loginctl", "reboot"]
# suspend_cmd  = ["loginctl", "suspend"]

[sessions]
# dirs = [
#     { path = "/usr/share/wayland-sessions", type = "wayland" },
#     { path = "/usr/share/xsessions", type = "x11" },
# ]
# X11 sessions are wrapped with this command prefix (prepended to the Exec= value).
# Set to [] to disable wrapping.
# x11_wrapper = ["startx", "/usr/bin/env"]

[theme]
# accent_color = ""
# aurora_speed = 1.0
